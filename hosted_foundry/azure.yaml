# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: a365-hosted-synthetic
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
services:
  ai-project:
    host: azure.ai.project
    endpoint: ${POC_EXISTING_PROJECT_ENDPOINT}
  synthetic-agent:
    host: azure.ai.agent
    project: src
    language: python
    kind: hosted
    name: ${POC_AGENT_NAME}
    description: Isolated synthetic arithmetic and metadata-only Agent 365 tracing.
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      POC_A365_EXPORT: ${POC_A365_EXPORT:-false}
      A365_TENANT_ID: ${A365_TENANT_ID:-}
      A365_AGENT_ID: ${A365_AGENT_ID:-}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
