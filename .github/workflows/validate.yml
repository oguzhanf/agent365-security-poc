name: Check the PoC kit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AZURE_CORE_COLLECT_TELEMETRY: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install document dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Run local checks
        shell: powershell
        run: .\scripts\Test-Kit.ps1
      - name: Build the document
        run: npm run build:docs
      - name: Check generated procedure text
        run: git diff --exit-code -- docs/POC.adoc
      - name: Compile the infrastructure template
        run: az bicep build --file infra\main.bicep --outfile "${{ runner.temp }}\agent365-infra.json"

  sdk-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the runtime lock
        run: python -m pip install --only-binary=:all: -r requirements-runtime.lock.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check SDK scopes with networking blocked
        run: python tests\runtime\sdk_offline_check.py

  hosted-imports:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install hosted dependencies
        run: python -m pip install --only-binary=:all: -r hosted_foundry\src\requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check imports with networking blocked
        run: python tests\foundry\sdk_import_check.py
